<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Vault</title>
    <script src="shares.js" defer></script>
    
    <style>
        :root {
            --bg-color: #0d0d0f;
            --window-bg: #1e1e1f;
            --sidebar-bg: rgba(30, 30, 32, 0.75);
            --content-bg: #161618;
            --card-hover: rgba(255, 255, 255, 0.08);
            --card-active: rgba(41, 151, 255, 0.2);
            --text-main: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 20%, #1c1c24 0%, #0d0d0f 100%);
        }

        .minecraft-enchant-text {
            font-size: 1.6rem;
            font-weight: 500;
            color: #d1d1d6;
            position: relative;
            display: inline-block;
            background: linear-gradient(90deg, #d1d1d6 0%, #ffffff 50%, #d1d1d6 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: chalkSweep 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            letter-spacing: -0.3px;
        }

        @keyframes chalkSweep {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #access-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 15, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .access-box {
            text-align: center;
            max-width: 420px;
            width: 90%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .access-box form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .access-box input {
            width: 100%;
            max-width: 320px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
            transition: all 0.2s;
        }

        .access-box input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
        }

        .btn-primary {
            width: 100%;
            max-width: 320px;
            padding: 12px;
            background: #f5f5f7;
            color: #0d0d0f;
            border: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-primary:hover { background: #ffffff; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-reject {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            max-width: 320px;
            display: none; /* Se activa mediante JS si la vista lo requiere */
        }

        .btn-reject:hover {
            color: #ff3b30;
            border-color: rgba(255, 59, 48, 0.3);
            background: rgba(255, 59, 48, 0.05);
        }

        #finder-app {
            display: none;
            width: 88vw;
            height: 82vh;
            max-width: 1050px;
            background: var(--window-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 70px rgba(0,0,0,0.7);
            flex-direction: column;
            overflow: hidden;
            animation: windowAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes windowAppear {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .window-header {
            height: 48px;
            background: linear-gradient(to bottom, #2c2c2e, #242426);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
            user-select: none;
        }

        .window-dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f56; border: 0.5px solid rgba(0,0,0,0.2); }
        .dot-yellow { background: #ffbd2e; border: 0.5px solid rgba(0,0,0,0.2); }
        .dot-green { background: #27c93f; border: 0.5px solid rgba(0,0,0,0.2); }

        .window-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .search-container {
            position: absolute;
            right: 16px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            width: 140px;
            transition: width 0.2s, background 0.2s;
        }

        .search-container:focus-within {
            width: 180px;
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-container svg {
            width: 12px;
            height: 12px;
            fill: var(--text-secondary);
        }

        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        .search-container input::placeholder {
            color: var(--text-secondary);
        }

        .finder-body { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 210px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.6px;
            padding-left: 8px;
            font-weight: 600;
        }

        .sidebar-item {
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            font-weight: 400;
        }

        .main-content {
            flex: 1;
            background: var(--content-bg);
            padding: 24px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            grid-auto-rows: max-content;
            gap: 16px;
            align-content: start;
        }
        
        .right-sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border);
            padding: 20px 16px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .right-sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.3;
        }

        .share-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
            display: none;
        }

        .custom-files-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 12px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
            border: 1px solid transparent;
            user-select: none;
        }

        .file-item:hover {
            background: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .file-item:active { background: var(--card-active); }

        .file-icon {
            width: 56px;
            height: 56px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .file-icon svg { width: 100%; height: 100%; }

        .file-name {
            font-size: 0.78rem;
            color: var(--text-main);
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
        }

        .finder-footer {
            height: 64px;
            background: rgba(30, 30, 32, 0.9);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 250px;
            min-width: 250px;
        }
        
        .track-title-wrapper {
            width: 140px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .track-title {
            display: inline-block;
            font-size: 0.83rem;
            color: var(--text-main);
            font-weight: 500;
            padding-left: 100%;
            animation: scrollText 7s linear infinite;
        }

        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .loading-bar {
            position: relative;
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .loading-bar.active { display: block; }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: shimmer 1s infinite;
        }

        @keyframes shimmer { 100% { left: 100%; } }

        .ios-eq {
            display: none; 
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            height: 16px;
            width: 28px;
        }
        .ios-eq.active { display: flex; }
        
        .ios-eq .bar {
            width: 3px;
            background-color: var(--text-main);
            border-radius: 2px;
            height: 16px;
            transform-origin: center;
            transform: scaleY(0.15);
            transition: transform 0.05s ease-out;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            justify-content: flex-end;
        }

        audio {
            width: 100%;
            max-width: 450px; 
            height: 36px;
            outline: none;
            border-radius: 8px;
            filter: invert(0.9) hue-rotate(180deg) contrast(1.1);
        }

        .download-btn {
            display: none; 
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        
        .download-btn:active {
            transform: translateY(1px);
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="access-screen">
        <div class="access-box">
            <h1 class="minecraft-enchant-text" id="accessTitle">Tengo algo para ti</h1>
            <form id="emailForm" action="https://formspree.io/f/xojpzykj" method="POST">
                <input type="email" name="email" placeholder="Introduce tu correo..." required>
                <button type="submit" class="btn-primary">Acceder</button>
            </form>
            <button id="rejectBtn" class="btn-reject" type="button">Rechazar el regalo</button>
        </div>
    </div>

    <div id="finder-app">
        <div class="window-header">
            <div class="window-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="window-title" id="windowTitle">@LUSARDI_VT</div>
            
            <div class="search-container">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar">
            </div>
        </div>

        <div class="finder-body">
            <div class="sidebar">
                <div class="sidebar-title">Favoritos</div>
                <div class="sidebar-item" onclick="navigateTo('@LUSARDI_VT')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    Beats & Loops
                </div>
            </div>

            <div class="main-content" id="fileGrid">
                <div class="loading-text" id="loadingText">Cargando directorio...</div>
            </div>
            
            <div class="right-sidebar" id="customSharePanel">
                <h3 class="minecraft-enchant-text" id="customShareTitle">Tengo algo para ti</h3>
                <p id="customShareMessage" class="share-message"></p>
                <div class="custom-files-grid" id="customShareGrid"></div>
            </div>
        </div>

        <div class="finder-footer">
            <div class="player-info" id="nowPlaying">
                <div class="track-title-wrapper">
                    <span class="track-title" id="trackTitle">Selecciona un beat</span>
                </div>
                <div class="loading-bar" id="audioLoadingBar"></div>
                <div class="ios-eq" id="audioEq">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
            
            <div class="player-controls">
                <audio id="audioPlayer" crossorigin="anonymous" controls></audio>
                <a id="downloadTrackBtn" class="download-btn" title="Descargar Track" download>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'lusardiint';
        const REPO_NAME = 'LusardiVault';
        let currentPath = '@LUSARDI_VT';

        const emailForm = document.getElementById('emailForm');
        const accessScreen = document.getElementById('access-screen');
        const finderApp = document.getElementById('finder-app');
        const searchInput = document.getElementById('searchInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const rejectBtn = document.getElementById('rejectBtn');
        const customSharePanel = document.getElementById('customSharePanel');

        let audioCtx, analyser, dataArray, source;
        let isAudioContextInitialized = false;

        const icons = {
            folder: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 16C6 13.7909 7.79086 12 10 12H24.382C25.4768 12 26.5313 12.4344 27.3137 13.2168L31.7868 17.6899C32.5692 18.4723 33.6237 18.9067 34.7185 18.9067H54C56.2091 18.9067 58 20.6976 58 22.9067V48C58 50.2091 56.2091 52 54 52H10C7.79086 52 6 50.2091 6 48V16Z" fill="url(#paint0_linear)"/><path d="M6 22.9067H58V48C58 50.2091 56.2091 52 54 52H10C7.79086 52 6 50.2091 6 48V22.9067Z" fill="url(#paint1_linear)"/><defs><linearGradient id="paint0_linear" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse"><stop stop-color="#55b2ff"/><stop offset="1" stop-color="#0064d2"/></linearGradient><linearGradient id="paint1_linear" x1="32" y1="22.9067" x2="32" y2="52" gradientUnits="userSpaceOnUse"><stop stop-color="#3fa5ff"/><stop offset="1" stop-color="#005ecb"/></linearGradient></defs></svg>`,
            audio: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="8" width="44" height="48" rx="8" fill="url(#audio_grad)"/><path d="M26 40V22L42 18V36" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="40" r="6" fill="white"/><circle cx="38" cy="36" r="6" fill="white"/><defs><linearGradient id="audio_grad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#ff3b30"/><stop offset="1" stop-color="#c70000"/></linearGradient></defs></svg>`,
            zip: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="8" width="44" height="48" rx="8" fill="url(#zip_grad)"/><path d="M22 20H42V44H22V20Z" fill="white" fill-opacity="0.2"/><path d="M32 16V48M20 28H44" stroke="white" stroke-width="4" stroke-linecap="round"/><defs><linearGradient id="zip_grad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#ff9500"/><stop offset="1" stop-color="#b86800"/></linearGradient></defs></svg>`,
            back: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="24" fill="#3a3a3c"/><path d="M36 22L24 32L36 42" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            file: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="6" width="40" height="52" rx="6" fill="url(#file_grad)"/><path d="M36 6V18H48" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="file_grad" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#8e8e93"/><stop offset="1" stop-color="#48484a"/></linearGradient></defs></svg>`
        };

        function initAudioVisualizer() {
            if (isAudioContextInitialized) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            analyser = audioCtx.createAnalyser();
            
            source = audioCtx.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            
            analyser.fftSize = 64;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            isAudioContextInitialized = true;
            
            renderFrame();
        }

        function renderFrame() {
            requestAnimationFrame(renderFrame);
            if (!audioCtx || audioPlayer.paused) return;

            analyser.getByteFrequencyData(dataArray);
            const bars = document.querySelectorAll('.ios-eq .bar');
            
            const step = Math.floor(dataArray.length / 5);
            
            bars.forEach((bar, index) => {
                let sum = 0;
                for (let i = 0; i < step; i++) {
                    sum += dataArray[(index * step) + i];
                }
                const avg = sum / step;
                let scale = 0.15 + (avg / 255) * 0.85; 
                bar.style.transform = `scaleY(${scale})`;
            });
        }

        searchInput.addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('#fileGrid .file-item');
            
            items.forEach(item => {
                const nameElement = item.querySelector('.file-name');
                if (!nameElement) return;
                
                if (nameElement.textContent === "Volver") {
                    item.style.display = term === '' ? 'flex' : 'none';
                    return;
                }

                if(nameElement.textContent.toLowerCase().includes(term)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        function checkCustomShare() {
            const hashId = window.location.hash.replace('#', '');
            const accessTitle = document.getElementById('accessTitle');

            if (hashId && window.vaultShares && window.vaultShares[hashId]) {
                const shareData = window.vaultShares[hashId];
                const grid = document.getElementById('customShareGrid');
                const title = document.getElementById('customShareTitle');
                const msg = document.getElementById('customShareMessage');
                
                if (shareData.title) title.textContent = shareData.title;
                
                if (shareData.message) {
                    msg.textContent = shareData.message;
                    msg.style.display = 'block';
                } else {
                    msg.style.display = 'none';
                }

                grid.innerHTML = '';
                
                if (shareData.files && shareData.files.length > 0) {
                    shareData.files.forEach(file => {
                        let iconSvg = icons.file;
                        if(file.type === 'audio') iconSvg = icons.audio;
                        if(file.type === 'zip') iconSvg = icons.zip;
                        if(file.type === 'folder') iconSvg = icons.folder;

                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `<div class="file-icon">${iconSvg}</div><div class="file-name">${file.name}</div>`;
                        
                        fileItem.addEventListener('click', () => {
                            const directUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${file.path}`;
                            if (file.type === 'audio') {
                                loadAndPlayAudio(directUrl, file.name);
                            } else {
                                window.open(directUrl, '_blank');
                            }
                        });
                        
                        grid.appendChild(fileItem);
                    });
                }
                
                customSharePanel.style.display = 'flex';

                const accessType = shareData.accessType || 1;

                if (accessType === 1) {
                    accessTitle.textContent = "Tengo algo para ti";
                    emailForm.style.display = 'block';
                    rejectBtn.style.display = 'block';

                } else if (accessType === 2) {
                    accessTitle.textContent = shareData.extraText || "Tengo algo para ti";
                    emailForm.style.display = 'block';
                    rejectBtn.style.display = 'block';

                } else if (accessType === 3) {
                    accessScreen.style.display = 'none';
                    finderApp.style.display = 'flex';
                    rejectBtn.style.display = 'none';
                    navigateTo('@LUSARDI_VT');

                } else if (accessType === 4) {
                    emailForm.style.display = 'none';
                    rejectBtn.style.display = 'none';
                    accessTitle.textContent = shareData.welcomeText || shareData.title || "Bienvenido";

                    setTimeout(() => {
                        accessScreen.style.opacity = '0';
                        setTimeout(() => {
                            accessScreen.style.display = 'none';
                            finderApp.style.display = 'flex';
                            navigateTo('@LUSARDI_VT');
                        }, 500);
                    }, 2200);
                }

            } else {
                if (hashId) {
                    window.history.replaceState(null, null, window.location.pathname);
                }
                customSharePanel.style.display = 'none';
                rejectBtn.style.display = 'none';
            }
        }

        rejectBtn.addEventListener('click', () => {
            customSharePanel.style.display = 'none';
            accessScreen.style.opacity = '0';
            setTimeout(() => {
                accessScreen.style.display = 'none';
                finderApp.style.display = 'flex';
                navigateTo('@LUSARDI_VT');
            }, 400);
        });

        emailForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(emailForm);

            accessScreen.style.opacity = '0';
            setTimeout(() => {
                accessScreen.style.display = 'none';
                finderApp.style.display = 'flex';
                navigateTo('@LUSARDI_VT');
            }, 400);

            try {
                await fetch(emailForm.action, { 
                    method: 'POST', 
                    body: formData, 
                    headers: { 'Accept': 'application/json' } 
                });
            } catch (error) {
                console.error('Error enviando formulario:', error);
            }
        });

        async function navigateTo(path) {
            currentPath = path;
            const fileGrid = document.getElementById('fileGrid');
            const windowTitle = document.getElementById('windowTitle');
            
            searchInput.value = '';
            fileGrid.innerHTML = '<div class="loading-text">Cargando directorio...</div>';
            windowTitle.textContent = path;

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`;

            try {
                const response = await fetch(apiUrl);

                if (response.status === 403) {
                    fileGrid.innerHTML = '<div class="loading-text" style="color: #ff3b30;">La web está temporalmente saturada (límite de la API de GitHub alcanzado). Vuelve a intentarlo en unos minutos.</div>';
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const items = await response.json();
                fileGrid.innerHTML = '';

                if (path !== '@LUSARDI_VT') {
                    const parentPath = path.substring(0, path.lastIndexOf('/')) || '@LUSARDI_VT';
                    const backItem = document.createElement('div');
                    backItem.className = 'file-item';
                    backItem.innerHTML = `<div class="file-icon">${icons.back}</div><div class="file-name">Volver</div>`;
                    backItem.addEventListener('click', () => navigateTo(parentPath));
                    fileGrid.appendChild(backItem);
                }

                if (!Array.isArray(items) || items.length === 0) {
                    if (path === '@LUSARDI_VT') {
                        fileGrid.innerHTML = '<div class="loading-text">La carpeta está vacía.</div>';
                    }
                    return;
                }

                items.forEach(item => {
                    let displayName = item.name.replace(/\.[^/.]+$/, "");
                    let iconSvg = icons.file;
                    let isFolder = item.type === 'dir';
                    let isAudio = item.name.toLowerCase().endsWith('.mp3') || item.name.toLowerCase().endsWith('.wav');
                    let isZip = item.name.toLowerCase().endsWith('.zip');

                    if (isFolder) {
                        iconSvg = icons.folder;
                        displayName = item.name;
                    } else if (isAudio) {
                        iconSvg = icons.audio;
                    } else if (isZip) {
                        iconSvg = icons.zip;
                    } else {
                        displayName = item.name;
                    }

                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.innerHTML = `<div class="file-icon">${iconSvg}</div><div class="file-name">${displayName}</div>`;

                    fileItem.addEventListener('click', () => {
                        if (isFolder) {
                            navigateTo(item.path);
                        } else if (isAudio) {
                            loadAndPlayAudio(item.download_url, displayName);
                        } else {
                            window.open(item.download_url, '_blank');
                        }
                    });

                    fileGrid.appendChild(fileItem);
                });

            } catch (error) {
                console.error('Error:', error);
                fileGrid.innerHTML = '<div class="loading-text" style="color: #ff3b30;">Error al conectar con GitHub.</div>';
            }
        }

        async function loadAndPlayAudio(audioUrl, title) {
            const trackTitle = document.getElementById('trackTitle');
            const loadingBar = document.getElementById('audioLoadingBar');
            const eqAnim = document.getElementById('audioEq');
            const downloadBtn = document.getElementById('downloadTrackBtn');
            const bars = document.querySelectorAll('.ios-eq .bar');

            trackTitle.innerHTML = title;
            loadingBar.classList.add('active');
            eqAnim.classList.remove('active');
            
            bars.forEach(bar => bar.style.transform = 'scaleY(0.15)');
            
            downloadBtn.href = audioUrl;
            downloadBtn.style.display = 'flex';
            
            audioPlayer.pause();

            try {
                const response = await fetch(audioUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                audioPlayer.src = blobUrl;
                
                audioPlayer.oncanplay = () => {
                    loadingBar.classList.remove('active');
                    audioPlayer.play().catch(() => {});
                };
                
                audioPlayer.onplay = () => {
                    eqAnim.classList.add('active');
                    if (!isAudioContextInitialized) {
                        initAudioVisualizer();
                    } else if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                };
                
                audioPlayer.onpause = () => {
                    bars.forEach(bar => bar.style.transform = 'scaleY(0.15)');
                };
                
                audioPlayer.onended = () => {
                    bars.forEach(bar => bar.style.transform = 'scaleY(0.15)');
                    eqAnim.classList.remove('active');
                };

            } catch (error) {
                console.error('Error cargando audio:', error);
                loadingBar.classList.remove('active');
                trackTitle.innerHTML = `Error cargando archivo.`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkCustomShare();
        });
    </script>
</body>
</html>
